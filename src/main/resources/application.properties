spring.application.name=Desafio03-DWF

# Configuración de base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_reservas?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Swagger/OpenAPI (Acceso en /swagger-ui/index.html)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Nota: Configura aquí también tus variables para JWT
jwt.secret=tu_clave
jwt.expiration=00000
